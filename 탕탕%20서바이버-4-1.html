<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>탕탕 서바이버</title>
<style>
:root{--bg:#1b2a1f;--fg:#fff;--card:#2b3d30;--ac:#ffd54a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#ov{overflow:auto;position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,18,12,.82);text-align:center;padding:20px}
#ov h1{margin:0;font-size:34px;color:var(--ac)}
#ov p{margin:0;opacity:.85;line-height:1.5}
#rv{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(10,18,12,.95);text-align:center;padding:20px;overflow:auto}#rv h1{margin:0;font-size:26px;color:var(--ac)}#rv p{margin:0;opacity:.85}.cg{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:420px}.cg .btn{font-size:14px;padding:10px 6px}
.rl{display:flex;flex-direction:column;gap:8px;width:100%;max-width:420px;text-align:left}.rr{background:var(--card);border-radius:10px;padding:8px 10px}.rr.on{outline:2px solid var(--ac)}#rb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);right:10px;z-index:5;background:#0008;color:#fff;border:1px solid #fff4;border-radius:10px;padding:6px 10px;font-size:14px}
.btn{background:var(--ac);color:#222;border:0;border-radius:12px;padding:12px 28px;font-size:18px;font-weight:700;cursor:pointer}
.cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{background:var(--card);border:2px solid var(--ac);border-radius:14px;padding:14px 12px;width:120px;cursor:pointer;color:var(--fg);font-size:14px}
.card b{display:block;font-size:34px;margin-bottom:6px}
</style></head><body>
<canvas id="c"></canvas>
<div id="ov"></div><button id="rb">📖 조합법</button><div id="rv"></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov'),rv=document.getElementById('rv');
let W,H;function rs(){W=cv.width=cv.clientWidth;H=cv.height=cv.clientHeight}addEventListener('resize',rs);rs();
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let joy=null;
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();joy={x:e.clientX-r.left,y:e.clientY-r.top,cx:0,cy:0,dx:0,dy:0,id:e.pointerId}});
addEventListener('pointermove',e=>{if(!joy||e.pointerId!=joy.id)return;const r=cv.getBoundingClientRect();let dx=e.clientX-r.left-joy.x,dy=e.clientY-r.top-joy.y,l=Math.hypot(dx,dy)||1,k=Math.min(l,50);joy.cx=dx/l*k;joy.cy=dy/l*k;joy.dx=joy.cx/50;joy.dy=joy.cy/50});
addEventListener('pointerup',e=>{if(joy&&e.pointerId==joy.id)joy=null});
const UP=[
['🔫','데미지 +25%',p=>p.dmg*=1.25],
['⚡','공격속도 +20%',p=>p.rate*=1.2],
['✨','탄환 +1',p=>p.n++],
['🎯','관통 +1',p=>p.pierce++],
['👟','이동속도 +10%',p=>p.spd*=1.1],
['❤️','최대체력 +25 & 회복',p=>{p.mhp+=25;p.hp=Math.min(p.mhp,p.hp+25)}],
['🧲','자석 범위 +40%',p=>p.mag*=1.4],
['🌀','회전 칼날 +1',p=>p.orb++],
['🌩️','번개 (낙뢰 +1)',p=>p.lt++],
['🔥','화염 오라',p=>p.aura++],
['❄️','얼음 파동 (감속)',p=>p.nova++],
['🚀','유도 미사일',p=>p.mis++],
['💥','치명타 +12%',p=>p.crit+=.12],
['🛡️','보호막 (피격 1회 방어)',p=>p.sh++],
['🪖','받는 피해 -10%',p=>p.armor++],
['💚','체력 재생 +1/초',p=>p.regen+=1],
['🧪','경험치 +25%',p=>p.xpm*=1.25],
['🩸','처치 시 체력 +0.5',p=>p.ls+=.5],
['🏹','탄속 +20%',p=>p.bs*=1.2],
['☄️','운석 낙하',p=>p.mt++],['☠️','독 지대',p=>p.pz++],['🪃','부메랑',p=>p.bm++],['🤖','공격 드론',p=>p.dr++],['⚔️','검기',p=>p.sw++],['🧨','지뢰',p=>p.mn++],['🍀','행운 (드롭률↑)',p=>p.luck++],['⏱️','쿨타임 -10%',p=>p.cdm*=.9]];
const EV=[['🌪️','불꽃 칼날 폭풍','🌀','🔥','bf'],['⛈️','뇌빙 폭풍','🌩️','❄️','st'],['🛸','핵폭격','🚀','💥','nk'],['🌋','용암 방패','🔥','🛡️','lv'],['🧊','빙결 미사일','❄️','🚀','fm'],['🔱','기관포','✨','🎯','mg'],['☀️','태양 낙하','☄️','🔥','sn'],['☣️','맹독 늪','☠️','🌩️','pt'],['🔪','칼날 부메랑','🪃','🌀','kb'],['🛰️','위성 포대','🤖','🚀','sat'],['🌙','달빛 참격','⚔️','💥','sl'],['☢️','핵지뢰','🧨','☠️','nm']];
const NM={'☄️':'운석 낙하','☠️':'독 지대','🪃':'부메랑','🤖':'공격 드론','⚔️':'검기','🧨':'지뢰','🌀':'회전 칼날','🌩️':'번개','🔥':'화염 오라','❄️':'얼음 파동','🚀':'유도 미사일','💥':'치명타','🛡️':'보호막','✨':'탄환','🎯':'관통'};
const RQ={mg:3};const ED={sn:'운석 +3, 폭발범위↑, 피해×1.5, 화상',pt:'늪 범위×1.6·지속↑, 피해×2, 생성 주기↓',kb:'부메랑 개수×2, 피해×1.5, 쿨타임↓',sat:'드론 개수×2, 연사×2, 탄 관통',sl:'360도 참격, 범위×1.5, 피해×1.5, 쿨타임↓',nm:'지뢰 폭발범위×1.9, 피해×1.5, 폭발 시 맹독 늪, 설치 주기↓',bf:'칼날 +2, 범위↑, 피해×1.5, 화상',st:'타격 수×2, 쿨타임↓, 빙결',nk:'미사일 무한 연사(0.15초마다), 폭발범위↑',lv:'오라 범위×1.6, 피해×2, 보호막 재생×2',fm:'폭발 시 빙결, 파동 범위×1.5·쿨↓',mg:'탄환 +2, 관통 +3, 공속×1.5'};
let rvOpen=false,S=null,started=false;
function showRv(){rvOpen=true;const pk=S?S.pk:{},ev=S?S.ev:{};rv.style.display='flex';
rv.innerHTML='<h1>📖 진화 조합법</h1><p>주 스킬이 필요 레벨(기본 6, 기관포 3) + 짝 스킬 보유 → 진화 카드 등장</p><div class=rl>'+EV.map(v=>{const a=pk[v[2]]||0,b=pk[v[3]]||0;return '<div class="rr'+(ev[v[4]]?' on':'')+'">'+v[0]+' <b>'+v[1]+'</b>'+(ev[v[4]]?' ✅':'')+'<br><small>'+v[2]+(NM[v[2]]||'')+' Lv.'+a+'/'+(RQ[v[4]]||6)+' '+(a>=(RQ[v[4]]||6)?'✓':'')+' + '+v[3]+(NM[v[3]]||'')+' '+(b?'✓':'✗')+'<br>'+ED[v[4]]+'</small></div>'}).join('')+'</div><button class=btn>닫기</button>';
rv.querySelector('button').onclick=()=>{rv.style.display='none';rvOpen=false}}
document.getElementById('rb').onclick=showRv;
function hurtP(dm){const p=S.p;if(p.inv>0)return;if(p.shv>0){p.shv=0;p.shc=Math.max(3,10-p.sh*1.5)*(S.ev.lv?.5:1)}else p.hp-=dm*Math.pow(.9,p.armor);p.inv=.5;S.sk=10}
function eshot(x,y,a,sp,dm){S.eb.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,dm,t:5})}
function msg(t){S.ms=t;S.mt=2.5}
const WS=1800,cl=v=>Math.max(-WS,Math.min(WS,v));
const CH=[['😎','레이너','균형형 · 기본 스탯',{},[]],['🤠','건너','공속↑ · 탄환 시작 · 체력↓',{hp:90,rate:1.9,spd:130},['탄환']],['🧝','마법사','번개 시작 · 쿨타임 -25%',{hp:80,cdm:.75},['번개']],['🦸','탱커','체력 160 · 방어 · 느림',{hp:160,spd:120,armor:2,regen:1.5},['보호막']],['🥷','닌자','검기 시작 · 빠름 · 치명타 25%',{hp:75,spd:195,crit:.25,rate:1.6},['검기']],['🧑‍🔬','연금술사','독 지대 시작 · 경험치 +30%',{xpm:1.3,mag:150},['독 지대']],['👷','폭격수','미사일 시작 · 피해 +15%',{hp:90,dmg:11.5},['유도']],['🔮','소환사','드론 시작 · 행운 +2',{hp:85,luck:2},['공격 드론']]];
function sPos(p,a,d){let x=p.x+Math.cos(a)*d,y=p.y+Math.sin(a)*d;if(Math.abs(x)>WS||Math.abs(y)>WS){x=p.x-Math.cos(a)*d;y=p.y-Math.sin(a)*d}return[cl(x),cl(y)]}
function near(x,y,r){let t=null,b=r*r;for(const e of S.en){const d=(e.x-x)**2+(e.y-y)**2;if(d<b){b=d;t=e}}return t}
function pushOb(o,r){for(const b of S.ob){const dx=o.x-b.x,dy=o.y-b.y;if(Math.abs(dx)>b.r+r||Math.abs(dy)>b.r+r)continue;const d=Math.hypot(dx,dy);if(d<b.r+r&&d>0){o.x=b.x+dx/d*(b.r+r);o.y=b.y+dy/d*(b.r+r)}}}
function genMap(){S.ob=[];for(let i=0;i<100;i++){const x=(Math.random()*2-1)*(WS-60),y=(Math.random()*2-1)*(WS-60);if(Math.hypot(x,y)<160)continue;S.ob.push({x,y,r:16+Math.random()*14,t:x<0?(y<0?'🌳':'🌵'):(y<0?'🌲':'🪨')})}}
function giveSkill(n){const u=UP.find(x=>x[1].startsWith(n));if(u){S.pk[u[0]]=(S.pk[u[0]]||0)+1;u[2](S.p)}}
function applyCh(c){const [,,,st,sk]=CH[c||0],p=S.p;if(st.hp)p.mhp=p.hp=st.hp;for(const k in st)if(k!='hp')p[k]=st[k];sk.forEach(giveSkill);S.ch0=c||0}
function showChars(){ov.style.display='flex';ov.innerHTML='<h1>캐릭터 선택</h1><div class=cards></div>';const bx=ov.querySelector('.cards');CH.forEach((c,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML='<b>'+c[0]+'</b>'+c[1]+'<small style=display:block;margin-top:6px;opacity:.85;font-size:12px>'+c[2]+'</small>';d.onclick=()=>start(i);bx.appendChild(d)})}
let kb='',tc=0,tt=0;
addEventListener('keydown',e=>{kb=(kb+e.key.toLowerCase()).slice(-5);if(kb=='cheat')showCheat()});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();if(e.clientY-r.top<50&&Math.abs(e.clientX-r.left-W/2)<60){const n=performance.now();tc=n-tt<800?tc+1:1;tt=n;if(tc>=7){tc=0;showCheat()}}});
function showCheat(){if(!S||S.over||!started)return;rvOpen=true;rv.style.display='flex';
const A=[['god','🛡 무적 토글'],['lv1','⬆ 레벨업 +1'],['lv5','⏫ 레벨업 +5'],['max','🎓 모든 스킬 Lv.6'],['evo','🔱 전 진화 해금'],...EV.map(v=>['ev_'+v[4],v[0]+' '+v[1]]),['heal','❤️ 체력 회복'],['xp','⭐ 경험치 덩어리'],['chest','🎁 보상 상자'],['mini','🦍 미니 보스'],['mid','👹 중간 보스'],['time','⏩ 시간 +60초'],['kill','💀 적 전멸']];
rv.innerHTML='<h1>🛠 치트 모드</h1><p id=cm>개발자용 메뉴</p><div class=cg>'+A.map(a=>'<button class=btn data-k='+a[0]+'>'+a[1]+'</button>').join('')+'</div><button class=btn id=cx>닫기</button>';
rv.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{cheat(b.dataset.k);rv.querySelector('#cm').textContent='✔ '+b.textContent+(b.dataset.k=='god'?(S.god?' ON':' OFF'):'')});
rv.querySelector('#cx').onclick=()=>{rv.style.display='none';rvOpen=false}}
function cheat(k){const p=S.p;
if(k=='god')S.god=!S.god;
else if(k=='lv1'||k=='lv5'){const n=k=='lv1'?1:5;S.lv+=n;S.pend+=n}
else if(k=='max'){for(const u of UP)while((S.pk[u[0]]||0)<6){S.pk[u[0]]=(S.pk[u[0]]||0)+1;u[2](p)}}
else if(k.startsWith('ev_')){const v=EV.find(x=>x[4]==k.slice(3));if(v&&!S.ev[v[4]]){S.ev[v[4]]=1;if(v[4]=='bf')p.orb+=2;if(v[4]=='mg'){p.n+=2;p.pierce+=3;p.rate*=1.5}}}
else if(k=='evo'){for(const v of EV)if(!S.ev[v[4]]){S.ev[v[4]]=1;if(v[4]=='bf')p.orb+=2;if(v[4]=='mg'){p.n+=2;p.pierce+=3;p.rate*=1.5}}}
else if(k=='heal')p.hp=p.mhp;
else if(k=='xp')S.gm.push({x:p.x,y:p.y,v:S.need,m:1});
else if(k=='chest')S.ch.push({x:p.x+50,y:p.y,b:1});
else if(k=='mini')spawn(2);else if(k=='mid')spawn(1);
else if(k=='time')S.t+=60;
else if(k=='kill')for(const e of S.en)e.hp=0}
function ai(e,dt,dx,dy,d,sp){if(e.fz>0)return;const a=Math.atan2(dy,dx);let m=1;
if(e.dash>0){e.dash-=dt;const v=e.b?380:330;e.x+=Math.cos(e.da)*v*dt;e.y+=Math.sin(e.da)*v*dt;return}
if(e.warn>0){e.warn-=dt;e.da=a;if(e.warn<=0)e.dash=e.b?.7:.5;return}
e.cd=(e.cd===undefined?2:e.cd)-dt;
if(e.sh){m=d<220?-.6:d<300?0:1;if(e.cd<=0){e.cd=2;eshot(e.x,e.y,a,170,8)}}
else if(e.ch){if(e.cd<=0&&d<350){e.cd=3;e.warn=.6}}
else if(e.bm){if(d<48){e.hp=0;S.fx.push({k:'x',x:e.x,y:e.y,t:.3});hurtP(18)}}
else if(e.b||e.el){if(e.cd<=0){const k=Math.floor(Math.random()*(e.b?4:3));
if(k==0){e.cd=e.b?2.5:3;const n=e.b?18:10;for(let i=0;i<n;i++)eshot(e.x,e.y,i/n*6.283,150,10)}
else if(k==1){e.cd=2;const w=e.b?2:1;for(let i=-w;i<=w;i++)eshot(e.x,e.y,a+i*.25,210,10)}
else if(k==2){e.cd=3.5;e.warn=.7}
else{e.cd=4;msg('👹 부하 소환!');for(let i=0;i<5;i++)spawn()}}}
e.x+=dx/d*sp*m*dt;e.y+=dy/d*sp*m*dt}
function init(c){S={t:0,kills:0,lv:1,xp:0,need:5,pend:0,nb:300,ne:60,nr:70,ns:40,eb:[],it:[],mm:[],pl:[],br:[],mnl:[],spawn:0,orbA:0,over:false,pause:false,en:[],bl:[],gm:[],fx:[],mi:[],pk:{},dn:[],pt:[],sk:0,ev:{},rw:0,ch:[],
p:{x:0,y:0,hp:100,mhp:100,spd:140,dmg:10,rate:1.4,n:1,pierce:0,mag:70,orb:0,cd:0,inv:0,bs:360,lt:0,ltcd:0,aura:0,ac:0,nova:0,nvcd:0,mis:0,mscd:0,crit:0,regen:0,xpm:1,ls:0,sh:0,shv:0,shc:0,armor:0,cdm:1,mt:0,mtcd:0,pz:0,pzcd:0,bm:0,bmcd:0,dr:0,drcd:0,sw:0,swcd:0,mn:0,mncd:0,luck:0}};genMap();applyCh(c)}
function spawn(b){const p=S.p,a=Math.random()*6.283,d=Math.max(W,H)/2+50,s=1+S.t/50,r=Math.random(),q=Math.random();let T;
if(b==1)T={e:'👹',hp:700*s,sp:55,r:50,dmg:25,b:1};else if(b==2)T={e:'🦍',hp:130*s,sp:65,r:30,dmg:18,el:1};else if(S.t>40&&q<.04)T={e:'🧙',hp:20*s,sp:55,r:15,dmg:6,sh:1};else if(S.t>50&&q<.15)T={e:'🐗',hp:30*s,sp:50,r:18,dmg:14,ch:1};else if(S.t>35&&q<.25)T={e:'💣',hp:10*s,sp:95,r:13,dmg:0,bm:1};else if(S.t>20&&q<.37)T={e:'🦠',hp:25*s,sp:55,r:17,dmg:8,sp2:1};
else if(S.t>60&&r<.2)T={e:'🐻',hp:40*s,sp:45,r:20,dmg:15};
else if(S.t>25&&r<.4)T={e:'🦇',hp:8*s,sp:110,r:12,dmg:6};
else T={e:'👾',hp:16*s,sp:68+S.t/5,r:14,dmg:9};
S.en.push({...T,dmg:T.dmg*(1+S.t/300),mhp:T.hp,x:sPos(p,a,d)[0],y:sPos(p,a,d)[1],oc:0,f:0,sl:0})}
function hit(e,d){let c=0;if(Math.random()<S.p.crit){d*=2;c=1}e.hp-=d;e.f=.08;S.dn.push({x:e.x+Math.random()*16-8,y:e.y-e.r,v:Math.round(d),c,t:.7});if(S.dn.length>60)S.dn.shift()}
function update(dt){
const p=S.p;S.t+=dt;
let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
if(joy){mx+=joy.dx;my+=joy.dy}
let l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}
p.x=cl(p.x+mx*p.spd*dt);p.y=cl(p.y+my*p.spd*dt);pushOb(p,12);p.inv-=dt;
S.spawn-=dt;if(S.spawn<=0){S.spawn=Math.max(.1,.7-S.t/150);const c=1+Math.floor(S.t/30);for(let i=0;i<c;i++)spawn()}
if(S.t>=S.nb){spawn(1);msg('👹 중간 보스 출현!');S.nb+=300}if(S.t>=S.ne){spawn(2);msg('🦍 미니 보스 출현!');S.ne+=60}
if(S.t>=S.nr){S.nr+=70;msg('⚠️ 포위 웨이브!');const s=1+S.t/50;for(let i=0;i<22;i++){const a=i/22*6.283;S.en.push({e:'👾',hp:14*s,mhp:14*s,sp:60+S.t/6,r:14,dmg:8,x:cl(p.x+Math.cos(a)*300),y:cl(p.y+Math.sin(a)*300),oc:0,f:0,sl:0})}}
